server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: movie-seckill-backend

  profiles:
    active: dev

  # ========== Jackson 配置 ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ========== Knife4j / OpenAPI3 ==========
knife4j:
  enable: true
  setting:
    language: zh_cn

# ========== 业务自定义配置 ==========
seckill:
  jwt:
    # 生产环境务必通过环境变量覆盖
    secret: ${JWT_SECRET:movie-seckill-dev-secret-key-please-change-in-production-2026}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7
  cache:
    caffeine-spec: maximumSize=10000,expireAfterWrite=30m
    redis-ttl-seconds: 1800
    null-value-ttl-seconds: 60
  mq:
    topic-order: seckill-order-topic
    topic-order-delay: seckill-order-delay-topic
    topic-inventory: seckill-inventory-topic

logging:
  level:
    com.wangning.seckill: info
    org.springframework.data.redis: warn

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
